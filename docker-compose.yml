version: '3.8'

services:
  vidmash:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vidmash-production
    restart: always
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - OUTPUT_DIR=./output
      - MAX_VIDEO_DURATION=14400
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./output:/app/output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
