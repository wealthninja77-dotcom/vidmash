<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VidMash — Autonomous Video Intelligence. Transform any video into a peer-reviewed research dossier with zero information loss.">
    <title>{% block title %}VidMash — Autonomous Video Intelligence{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        apple: {
                            black: '#000000',
                            canvas: '#050507',
                            card: '#0e0e11',
                            cardHover: '#141418',
                            border: 'rgba(255, 255, 255, 0.08)',
                            borderLight: 'rgba(255, 255, 255, 0.14)',
                            textPrimary: '#F5F5F7',
                            textSecondary: '#86868B',
                            textTertiary: '#636366',
                            blue: '#0071E3',
                            blueHover: '#0077ED',
                            emerald: '#30D158',
                        }
                    },
                    fontFamily: {
                        sans: [
                            '-apple-system',
                            'BlinkMacSystemFont',
                            '"SF Pro Display"',
                            '"SF Pro Text"',
                            '"Inter"',
                            'system-ui',
                            'sans-serif'
                        ],
                        serif: ['Charter', '"New York"', 'Georgia', 'serif'],
                        mono: ['"SF Mono"', '"JetBrains Mono"', 'Menlo', 'monospace'],
                    },
                    letterSpacing: {
                        tighter: '-0.035em',
                        tight: '-0.02em',
                        normal: '0',
                        wide: '0.02em',
                    }
                },
            },
        }
    </script>

    <!-- Google Fonts for fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>

    <!-- App Custom Minimal Styles -->
    <link rel="stylesheet" href="/static/css/style.css">

    <!-- Favicon -->
    <link rel="icon" href="/static/img/logo.svg" type="image/svg+xml">

    <style>
        /* Apple-grade smooth typography & scrollbar */
        * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: #2c2c2e; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a3a3c; }
    </style>

    {% block head %}{% endblock %}
</head>
<body class="bg-apple-black text-apple-textPrimary font-sans antialiased min-h-screen flex flex-col selection:bg-apple-blue selection:text-white">

    {% include "components/header.html" %}

    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    {% include "components/footer.html" %}

    <!-- App JS -->
    <script src="/static/js/app.js"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
